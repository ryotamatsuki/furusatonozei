name: Generate PR4 UI interaction fix

on:
  push:
    branches:
      - improve/ordinary-grant-estimate-20260823
    paths:
      - .github/workflows/generate-pr4-ui-fix.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Regenerate dashboard and remove one-shot workflow
        run: |
          python scripts/build_dashboard.py
          git rm .github/workflows/generate-pr4-ui-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data/processed/furusato_data.json
          git commit -m "Apply deferred distribution redraw to generated UI"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823
