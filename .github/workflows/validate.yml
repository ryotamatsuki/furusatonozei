name: Validate dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: Python data and structure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Discover ordinary grant sources on implementation branch
        if: ${{ github.ref_name == 'improve/ordinary-grant-estimate-20260823' || github.head_ref == 'improve/ordinary-grant-estimate-20260823' }}
        run: python scripts/discover_grant_sources.py

      - name: Upload ordinary grant discovery artifact
        if: ${{ always() && (github.ref_name == 'improve/ordinary-grant-estimate-20260823' || github.head_ref == 'improve/ordinary-grant-estimate-20260823') }}
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-grant-source-discovery-${{ github.run_id }}
          path: /tmp/grant-source-candidates.json
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the generated offline bundle
        run: |
          python scripts/build_data.py --check
          python scripts/validate_repository.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node --version
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim());
          scripts.forEach((source, index) => {
            fs.writeFileSync(`/tmp/furusato-inline-${index}.js`, source);
          });
          if (!scripts.length) throw new Error('no inline scripts found');
          console.log(`extracted ${scripts.length} inline scripts`);
          NODE
          for script in /tmp/furusato-inline-*.js; do
            node --check "$script"
          done

  browser-e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  full-source-reconciliation:
    name: Official source full reconciliation
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download and verify official workbooks
        run: python scripts/download_sources.py

      - name: Reconcile every official source row
        run: |
          python scripts/validate_sources.py --no-download --report /tmp/source-reconciliation-report.json

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-reconciliation-${{ github.run_id }}
          path: /tmp/source-reconciliation-report.json
          if-no-files-found: ignore
