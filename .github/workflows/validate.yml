name: Validate dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-ui-fix:
    name: Finalize PR4 generated UI interaction fix
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 4 }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Regenerate fixed UI and remove temporary generation hooks
        run: |
          python scripts/build_dashboard.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/validate.yml')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'\n  finalize-ui-fix:\n.*?\n  python-validation:',
              '\n  python-validation:',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one temporary finalize job, got {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          git rm -f --ignore-unmatch .github/workflows/generate-pr4-ui-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/validate.yml index.html data/processed/furusato_data.json
          git commit -m "Finalize distribution interaction UI fix"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823

  python-validation:
    name: Python data and structure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the generated offline bundle
        run: |
          python scripts/build_data.py --check
          python scripts/validate_repository.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node --version
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((source) => source.trim());
          scripts.forEach((source, index) => fs.writeFileSync(`/tmp/furusato-inline-${index}.js`, source));
          if (!scripts.length) throw new Error('no inline scripts found');
          console.log(`extracted ${scripts.length} inline scripts`);
          NODE
          for script in /tmp/furusato-inline-*.js; do node --check "$script"; done

  browser-e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  full-source-reconciliation:
    name: Furusato official source full reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download and verify official workbooks
        run: python scripts/download_sources.py
      - name: Reconcile every official furusato source row
        run: python scripts/validate_sources.py --no-download --report /tmp/source-reconciliation-report.json
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-reconciliation-${{ github.run_id }}
          path: /tmp/source-reconciliation-report.json
          if-no-files-found: ignore

  ordinary-grant-reconciliation:
    name: Ordinary grant official source full reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Independently reconcile every ordinary-grant row and derived estimate
        run: python scripts/validate_ordinary_grant.py
      - name: Upload ordinary-grant reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-grant-reconciliation-${{ github.run_id }}
          path: data/processed/ordinary_grant_reconciliation_report.json
          if-no-files-found: ignore

  generated-artifact-reproducibility:
    name: Rebuild generated data and UI reproducibly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rebuild from all pinned official sources
        run: python scripts/build_dashboard.py
      - name: Ensure committed generated artifacts are current
        run: git diff --exit-code -- index.html data/processed/furusato_data.json
