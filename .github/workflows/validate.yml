name: Validate dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-pr4:
    name: PR4 schema migration cleanup
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 4 }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - name: Patch legacy validator schema mappings and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('scripts/validate_sources.py')
          text=p.read_text(encoding='utf-8')
          old='''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_with_75pct_reference": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11}.items():'''
          new='''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_before_tax_adjustment": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11, "balance_with_75pct_reference": 19}.items():'''
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('validate_sources history schema is unexpected')
          p.write_text(text,encoding='utf-8')

          p=Path('scripts/validate_repository.py')
          text=p.read_text(encoding='utf-8')
          old_fields='''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
    ]:'''
          new_fields='''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
        "ordinaryGrantFiscalYear",
        "ordinaryGrantAmount",
        "ordinaryGrantStatus",
        "ordinaryGrantSourceStage",
        "ordinaryGrantSourceStageLabel",
        "ordinaryGrantSourceRow",
        "ordinaryGrantSourceUrl",
        "ordinaryGrantSourceSha256",
        "ordinaryGrantEstimate",
        "balanceWithOrdinaryGrantEstimate",
    ]:'''
          if old_fields in text:
              text=text.replace(old_fields,new_fields,1)
          elif new_fields not in text:
              raise SystemExit('validate_repository FIVE_YEAR_FIELDS schema is unexpected')
          old_positions='''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_with_75pct_reference": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
    }'''
          new_positions='''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_before_tax_adjustment": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
        "balance_with_75pct_reference": 19,
    }'''
          if old_positions in text:
              text=text.replace(old_positions,new_positions,1)
          elif new_positions not in text:
              raise SystemExit('validate_repository history schema is unexpected')
          p.write_text(text,encoding='utf-8')
          PY
          git rm -f --ignore-unmatch .ci-trigger-pr4
          git rm -f --ignore-unmatch .github/workflows/inspect-pr4-ui.yml
          git rm -f --ignore-unmatch .github/workflows/final-pr4-audit.yml
          git rm -f --ignore-unmatch .github/workflows/fix-pr4-validators.yml
          git rm -f --ignore-unmatch .github/workflows/rebuild-pr4.yml
          git rm -f --ignore-unmatch scripts/discover_grant_sources.py
          git rm -f --ignore-unmatch scripts/inspect_grant_workbooks.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_sources.py scripts/validate_repository.py
          if git diff --cached --quiet; then
            echo "Nothing to repair"
          else
            git commit -m "Finalize PR4 validation schema and cleanup"
            git push origin HEAD:improve/ordinary-grant-estimate-20260823
          fi

  python-validation:
    name: Python data and structure validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the generated offline bundle
        run: |
          python scripts/build_data.py --check
          python scripts/validate_repository.py
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node --version
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map((match) => match[1]).filter((source) => source.trim());
          scripts.forEach((source, index) => fs.writeFileSync(`/tmp/furusato-inline-${index}.js`, source));
          if (!scripts.length) throw new Error('no inline scripts found');
          console.log(`extracted ${scripts.length} inline scripts`);
          NODE
          for script in /tmp/furusato-inline-*.js; do node --check "$script"; done

  browser-e2e:
    name: Playwright browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  full-source-reconciliation:
    name: Furusato official source full reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download and verify official workbooks
        run: python scripts/download_sources.py
      - name: Reconcile every official furusato source row
        run: python scripts/validate_sources.py --no-download --report /tmp/source-reconciliation-report.json
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-reconciliation-${{ github.run_id }}
          path: /tmp/source-reconciliation-report.json
          if-no-files-found: ignore

  ordinary-grant-reconciliation:
    name: Ordinary grant official source full reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Independently reconcile every ordinary-grant row and derived estimate
        run: python scripts/validate_ordinary_grant.py
      - name: Upload ordinary-grant reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-grant-reconciliation-${{ github.run_id }}
          path: data/processed/ordinary_grant_reconciliation_report.json
          if-no-files-found: ignore

  generated-artifact-reproducibility:
    name: Rebuild generated data and UI reproducibly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rebuild from all pinned official sources
        run: python scripts/build_dashboard.py
      - name: Ensure committed generated artifacts are current
        run: git diff --exit-code -- index.html data/processed/furusato_data.json
