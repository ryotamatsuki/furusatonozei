name: Finalize PR4 validation schema

on:
  pull_request:
    paths:
      - .github/workflows/inspect-pr4-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - name: Patch validators, restore production CI, and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('scripts/validate_sources.py')
          text=p.read_text(encoding='utf-8')
          old='''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_with_75pct_reference": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11}.items():'''
          new='''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_before_tax_adjustment": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11, "balance_with_75pct_reference": 19}.items():'''
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('validate_sources history schema is unexpected')
          p.write_text(text,encoding='utf-8')

          p=Path('scripts/validate_repository.py')
          text=p.read_text(encoding='utf-8')
          old_fields='''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
    ]:'''
          new_fields='''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
        "ordinaryGrantFiscalYear",
        "ordinaryGrantAmount",
        "ordinaryGrantStatus",
        "ordinaryGrantSourceStage",
        "ordinaryGrantSourceStageLabel",
        "ordinaryGrantSourceRow",
        "ordinaryGrantSourceUrl",
        "ordinaryGrantSourceSha256",
        "ordinaryGrantEstimate",
        "balanceWithOrdinaryGrantEstimate",
    ]:'''
          if old_fields in text:
              text=text.replace(old_fields,new_fields,1)
          elif new_fields not in text:
              raise SystemExit('validate_repository FIVE_YEAR_FIELDS schema is unexpected')
          old_positions='''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_with_75pct_reference": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
    }'''
          new_positions='''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_before_tax_adjustment": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
        "balance_with_75pct_reference": 19,
    }'''
          if old_positions in text:
              text=text.replace(old_positions,new_positions,1)
          elif new_positions not in text:
              raise SystemExit('validate_repository history schema is unexpected')
          p.write_text(text,encoding='utf-8')

          # Remove the temporary write-enabled repair job from production CI.
          p=Path('.github/workflows/validate.yml')
          text=p.read_text(encoding='utf-8')
          updated,count=re.subn(r'\n  repair-pr4:\n.*?\n  python-validation:', '\n  python-validation:', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'validate.yml repair block matches={count}')
          p.write_text(updated,encoding='utf-8')
          PY
          git rm -f --ignore-unmatch .ci-trigger-pr4
          git rm -f --ignore-unmatch .github/workflows/final-pr4-audit.yml
          git rm -f --ignore-unmatch .github/workflows/fix-pr4-validators.yml
          git rm -f --ignore-unmatch .github/workflows/rebuild-pr4.yml
          git rm -f --ignore-unmatch scripts/discover_grant_sources.py
          git rm -f --ignore-unmatch scripts/inspect_grant_workbooks.py
          git rm -f .github/workflows/inspect-pr4-ui.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_sources.py scripts/validate_repository.py .github/workflows/validate.yml
          git commit -m "Finalize PR4 validators and remove diagnostics"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823
