name: Inspect PR4 UI snippets

on:
  pull_request:
    paths:
      - .github/workflows/inspect-pr4-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print targeted index snippets
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          needles = [
              'const HISTORY_INDEX',
              'function setFiscalYear',
              'function applyFiscalYear',
              'historicalPopupHtml',
              'function renderHistory',
              'function downloadBaseAuditCsv',
              'referenceBalance',
          ]
          for needle in needles:
              print('\n===== ' + needle + ' =====')
              start = 0
              shown = 0
              while shown < 12:
                  idx = text.find(needle, start)
                  if idx < 0:
                      break
                  a = max(0, idx - 1200)
                  b = min(len(text), idx + 2600)
                  print(text[a:b].replace('\r',''))
                  print('\n--- MATCH END ---')
                  start = idx + len(needle)
                  shown += 1
              print('matches_shown=', shown)
          PY
