name: Final PR4 full source audit and cleanup

on:
  push:
    branches:
      - improve/ordinary-grant-estimate-20260823
    paths:
      - .github/workflows/final-pr4-audit.yml

permissions:
  contents: write

jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Reconcile all furusato official source rows
        run: |
          python scripts/download_sources.py
          python scripts/validate_sources.py --no-download --report /tmp/furusato-source-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/processed/furusato_data.json').read_text(encoding='utf-8'))
          report=json.loads(Path('/tmp/furusato-source-reconciliation.json').read_text(encoding='utf-8'))
          rows=sum(len(data['years'][str(y)]['records']) for y in range(2020,2025))
          if rows != 8705:
              raise SystemExit(f'expected 8705 requested rows, got {rows}')
          if report:
              raise SystemExit(f'furusato mismatches: {len(report)}')
          print('REQUESTED FURUSATO RECONCILIATION OK')
          print('requested 2020-2024 rows:', rows)
          print('requested comparisons (25 fields):', rows*25)
          print('requested mismatches: 0')
          PY
      - name: Independently reconcile ordinary grant workbooks
        run: python scripts/validate_ordinary_grant.py
      - name: Run unit tests and repository validation
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_repository.py
      - name: Remove implementation-only diagnostics after successful audit
        run: |
          git rm -f .ci-trigger-pr4 || true
          git rm -f .github/workflows/inspect-pr4-ui.yml || true
          git rm -f .github/workflows/rebuild-pr4.yml || true
          git rm -f scripts/discover_grant_sources.py || true
          git rm -f scripts/inspect_grant_workbooks.py || true
          git rm -f .github/workflows/final-pr4-audit.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: remove PR4 implementation diagnostics"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823
