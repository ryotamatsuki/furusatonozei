name: Fix PR4 validators for augmented history schema

on:
  push:
    branches:
      - improve/ordinary-grant-estimate-20260823
    paths:
      - .github/workflows/fix-pr4-validators.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - name: Update validator schema mappings
        run: |
          python - <<'PY'
          from pathlib import Path

          # Independent official-source reconciler: r[7] is now the primary
          # before-grant balance; the legacy 75% reference moved to r[19].
          p = Path('scripts/validate_sources.py')
          text = p.read_text(encoding='utf-8')
          old = '''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_with_75pct_reference": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11}.items():'''
          new = '''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_before_tax_adjustment": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11, "balance_with_75pct_reference": 19}.items():'''
          if text.count(old) != 1:
              raise SystemExit(f'validate_sources history mapping matches={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Fast repository validator: accept the augmented latest snapshot and
          # validate both the primary and retained legacy history balances.
          p = Path('scripts/validate_repository.py')
          text = p.read_text(encoding='utf-8')
          old_fields = '''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
    ]:'''
          new_fields = '''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
        "ordinaryGrantFiscalYear",
        "ordinaryGrantAmount",
        "ordinaryGrantStatus",
        "ordinaryGrantSourceStage",
        "ordinaryGrantSourceStageLabel",
        "ordinaryGrantSourceRow",
        "ordinaryGrantSourceUrl",
        "ordinaryGrantSourceSha256",
        "ordinaryGrantEstimate",
        "balanceWithOrdinaryGrantEstimate",
    ]:'''
          if text.count(old_fields) != 1:
              raise SystemExit(f'validate_repository fields matches={text.count(old_fields)}')
          text = text.replace(old_fields, new_fields, 1)
          old_positions = '''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_with_75pct_reference": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
    }'''
          new_positions = '''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_before_tax_adjustment": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
        "balance_with_75pct_reference": 19,
    }'''
          if text.count(old_positions) != 1:
              raise SystemExit(f'validate_repository positions matches={text.count(old_positions)}')
          p.write_text(text.replace(old_positions, new_positions, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/fix-pr4-validators.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate_sources.py scripts/validate_repository.py
          git commit -m "Fix validation for augmented history schema"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823
