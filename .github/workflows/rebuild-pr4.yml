name: Rebuild PR4 augmented dashboard

on:
  pull_request:
    paths:
      - .github/workflows/rebuild-pr4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Rebuild from official sources
        run: python scripts/build_dashboard.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Independently reconcile ordinary grant workbooks
        run: python scripts/validate_ordinary_grant.py

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          scripts.forEach((source, index) => fs.writeFileSync(`/tmp/furusato-inline-${index}.js`, source));
          if (!scripts.length) throw new Error('no inline scripts found');
          NODE
          for script in /tmp/furusato-inline-*.js; do node --check "$script"; done

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/processed/furusato_data.json data/processed/ordinary_grant_reconciliation_report.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current"
          else
            git commit -m "build: regenerate dashboard with ordinary grant model"
            git push origin HEAD:improve/ordinary-grant-estimate-20260823
          fi
