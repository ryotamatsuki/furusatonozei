name: Rebuild PR4 augmented dashboard

on:
  pull_request:
    paths:
      - .github/workflows/rebuild-pr4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Update validators and production CI for augmented history schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('scripts/validate_sources.py')
          text=p.read_text(encoding='utf-8')
          old='''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_with_75pct_reference": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11}.items():'''
          new='''            for field, position in {"received": 1, "expense": 2, "proxy": 3, "municipal_tax_deduction": 4, "prefectural_tax_deduction": 5, "resident_tax_deduction_total": 6, "balance_before_tax_adjustment": 7, "receipt_source_row": 8, "tax_source_row": 9, "receipt_raw_code6": 10, "tax_raw_code6": 11, "balance_with_75pct_reference": 19}.items():'''
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('validate_sources history schema is unexpected')
          p.write_text(text,encoding='utf-8')

          p=Path('scripts/validate_repository.py')
          text=p.read_text(encoding='utf-8')
          old_fields='''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
    ]:'''
          new_fields='''    if embedded_fields != [
        "received",
        "expense",
        "proxy",
        "taxDeduction",
        "prefecturalTaxDeduction",
        "residentTaxDeductionTotal",
        "referenceBalance",
        "receiptSourceRow",
        "taxSourceRow",
        "receiptRawSourceCode6",
        "taxRawSourceCode6",
        "ordinaryGrantFiscalYear",
        "ordinaryGrantAmount",
        "ordinaryGrantStatus",
        "ordinaryGrantSourceStage",
        "ordinaryGrantSourceStageLabel",
        "ordinaryGrantSourceRow",
        "ordinaryGrantSourceUrl",
        "ordinaryGrantSourceSha256",
        "ordinaryGrantEstimate",
        "balanceWithOrdinaryGrantEstimate",
    ]:'''
          if old_fields in text:
              text=text.replace(old_fields,new_fields,1)
          elif new_fields not in text:
              raise SystemExit('validate_repository FIVE_YEAR_FIELDS schema is unexpected')
          old_positions='''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_with_75pct_reference": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
    }'''
          new_positions='''    history_positions = {
        "received": 1,
        "expense": 2,
        "proxy": 3,
        "municipal_tax_deduction": 4,
        "prefectural_tax_deduction": 5,
        "resident_tax_deduction_total": 6,
        "balance_before_tax_adjustment": 7,
        "receipt_source_row": 8,
        "tax_source_row": 9,
        "receipt_raw_code6": 10,
        "tax_raw_code6": 11,
        "balance_with_75pct_reference": 19,
    }'''
          if old_positions in text:
              text=text.replace(old_positions,new_positions,1)
          elif new_positions not in text:
              raise SystemExit('validate_repository history schema is unexpected')
          p.write_text(text,encoding='utf-8')

          p=Path('.github/workflows/validate.yml')
          text=p.read_text(encoding='utf-8')
          if '\n  repair-pr4:\n' in text:
              text,count=re.subn(r'\n  repair-pr4:\n.*?\n  python-validation:', '\n  python-validation:', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'validate.yml repair block matches={count}')
              p.write_text(text,encoding='utf-8')
          PY

      - name: Rebuild from all pinned official sources
        run: python scripts/build_dashboard.py

      - name: Reconcile every furusato official source row
        run: |
          python scripts/download_sources.py
          python scripts/validate_sources.py --no-download --report /tmp/furusato-source-reconciliation.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/processed/furusato_data.json').read_text(encoding='utf-8'))
          report=json.loads(Path('/tmp/furusato-source-reconciliation.json').read_text(encoding='utf-8'))
          rows=sum(len(data['years'][str(y)]['records']) for y in range(2020,2025))
          if rows != 8705 or report:
              raise SystemExit(f'requested reconciliation failed: rows={rows} mismatches={len(report)}')
          print('REQUESTED 2020-2024 FURUSATO RECONCILIATION OK')
          print('rows:', rows)
          print('field comparisons (25 per record):', rows*25)
          print('mismatches: 0')
          PY

      - name: Independently reconcile ordinary grant workbooks
        run: python scripts/validate_ordinary_grant.py

      - name: Validate generated repository structure
        run: python scripts/validate_repository.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m => m[1]).filter(Boolean);
          scripts.forEach((source, index) => fs.writeFileSync(`/tmp/furusato-inline-${index}.js`, source));
          if (!scripts.length) throw new Error('no inline scripts found');
          NODE
          for script in /tmp/furusato-inline-*.js; do node --check "$script"; done

      - name: Remove implementation-only diagnostics and commit final branch
        run: |
          git rm -f --ignore-unmatch .ci-trigger-pr4
          git rm -f --ignore-unmatch .github/workflows/inspect-pr4-ui.yml
          git rm -f --ignore-unmatch .github/workflows/final-pr4-audit.yml
          git rm -f --ignore-unmatch .github/workflows/fix-pr4-validators.yml
          git rm -f --ignore-unmatch scripts/discover_grant_sources.py
          git rm -f --ignore-unmatch scripts/inspect_grant_workbooks.py
          git rm -f .github/workflows/rebuild-pr4.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_sources.py scripts/validate_repository.py .github/workflows/validate.yml index.html data/processed/furusato_data.json data/processed/ordinary_grant_reconciliation_report.json
          git commit -m "Finalize ordinary grant model and full-source validation"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823
