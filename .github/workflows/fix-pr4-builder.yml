name: Fix PR4 builder exact-count patch

on:
  push:
    branches:
      - improve/ordinary-grant-estimate-20260823
    paths:
      - .github/workflows/fix-pr4-builder.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/ordinary-grant-estimate-20260823
          fetch-depth: 0
      - name: Patch builder and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_dashboard.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''def replace_regex_once(text: str, pattern: str, replacement: str, label: str) -> str:\n    updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)\n    if count != 1:\n        fail(f"UI patch {label}: expected exactly one regex match, got {count}")\n    return updated\n'''
          helper = '''\n\ndef replace_exact_count(text: str, old: str, new: str, label: str, expected_count: int) -> str:\n    count = text.count(old)\n    if count != expected_count:\n        fail(f"UI patch {label}: expected exactly {expected_count} matches, got {count}")\n    return text.replace(old, new, expected_count)\n'''
          if helper.strip() not in text:
              if anchor not in text:
                  raise SystemExit('replace_regex_once anchor not found')
              text = text.replace(anchor, anchor + helper, 1)
          old_call = '''    text = replace_once(\n        text,\n        'if(key==="afterGrantPerCapita")return Number.isFinite(d.afterGrant)&&Number.isFinite(d.population)&&d.population>0?d.afterGrant/d.population:null;',\n        'if(key==="afterGrantPerCapita")return Number.isFinite(d.beforeGrant)&&Number.isFinite(d.population)&&d.population>0?d.beforeGrant/d.population:null;',\n        "per-capita fiscal impact",\n    )'''
          new_call = '''    text = replace_exact_count(\n        text,\n        'if(key==="afterGrantPerCapita")return Number.isFinite(d.afterGrant)&&Number.isFinite(d.population)&&d.population>0?d.afterGrant/d.population:null;',\n        'if(key==="afterGrantPerCapita")return Number.isFinite(d.beforeGrant)&&Number.isFinite(d.population)&&d.population>0?d.beforeGrant/d.population:null;',\n        "per-capita fiscal impact",\n        2,\n    )'''
          if old_call not in text:
              raise SystemExit('per-capita patch call not found')
          text = text.replace(old_call, new_call, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/fix-pr4-builder.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build_dashboard.py
          git commit -m "Fix duplicated per-capita UI patch"
          git push origin HEAD:improve/ordinary-grant-estimate-20260823
